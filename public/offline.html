<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 · ULIF</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        background: #f9f9f7;
        color: #0b0b0b;
        text-align: center;
        padding: 2rem;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0d0d0d; color: #fff; }
      }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 1.05rem; margin: 0.5rem 0 0; }
      p { font-size: 0.85rem; opacity: 0.65; margin: 0; }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.4rem;
        border: 0;
        border-radius: 0.6rem;
        background: #2a78d6;
        color: #fff;
        font-size: 0.85rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <img src="/icon-192.png" alt="ULIF" />
    <h1>인터넷 연결이 없습니다</h1>
    <p>네트워크에 다시 연결되면 ULIF를 이용할 수 있어요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </body>
</html>
